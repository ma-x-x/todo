# 生产环境的 Docker Compose 配置文件

services:
  # API 应用服务配置
  app:
    # 指定镜像名称，使用 BUILD_VERSION 环境变量作为标签
    image: todo-api:${BUILD_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-api
    ports:
      - "8081:8081"  # 端口映射：宿主机端口:容器端口
    
    # 环境变量配置
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - APP_ENV=prod
      - LOG_LEVEL=info
      - CONFIG_FILE=/app/configs/config.prod.yaml
      - TZ=Asia/Shanghai
      - SWAGGER_HOST=${SWAGGER_HOST:-api.example.com}
    
    # 数据卷挂载
    volumes:
      - ./configs:/app/configs:ro  # 只读方式挂载配置文件
      - ./logs:/app/logs  # 挂载日志目录
    
    # 健康检查配置
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

